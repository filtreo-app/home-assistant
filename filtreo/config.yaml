name: Filtreo
version: "0.10.6"
slug: filtreo
description: Il filtro di casa anti pubblicità e tracker, per tutta la rete (motore Blocky).
url: "https://github.com/filtreo-app/home-assistant"
image: "ghcr.io/filtreo-app/{arch}-filtreo"
arch:
  - aarch64
  - amd64
init: false
host_network: true          # serve anche all'annuncio Bonjour «_filtreo._tcp» (mdns.py)
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant   # 0.10.6: alla prima installazione riavvia Home Assistant una volta (Filtreo tra i rilevati)
discovery:
  - filtreo                  # 0.10.3: Filtreo compare in Impostazioni › Dispositivi e servizi › Rilevato     # 3.2: notifica in Home Assistant con il codice di 6 cifre per collegare un'app
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-check
panel_title: Filtreo
boot: auto
startup: services
watchdog: "http://[HOST]:8099/salute"
map:
  - share:rw
  - homeassistant_config:rw   # per copiare l'integrazione Filtreo in /homeassistant/custom_components (si spegne con integrazione_ha: false)
options:
  integrazione_ha: true
schema:
  chiave_barra: "password?"
  integrazione_ha: bool?
